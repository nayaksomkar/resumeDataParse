[project]
name = "resume-data-parse"
version = "0.1.0"
description = "Extract structured resume data from plain-text resumes using LangChain + NVIDIA NIM."
readme = "README.md"
requires-python = ">=3.11"

authors = [{ name = "Somkar Nayak" }]
keywords = ["resume", "parser", "langchain", "nvidia", "nlp", "extraction"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Topic :: Text Processing",
]

dependencies = [
    "langchain-core>=0.3.0",
    "langchain-nvidia-ai-endpoints>=0.3.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
resume-parse = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
